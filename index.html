<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gym</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Gym 1.1 — energetic light theme.
   Layout: one phone column. Colour blocks for the moments that matter (up next, workout header, bests),
   white everywhere else. Floating tab bar, bottom sheets for logging, big thumb-sized controls.
   Light only, by choice: the brief is a white ground with orange and neon-lime energy. */
:root {
  --bg: #ffffff;
  --surface: #f4f4ef;
  --surface-2: #e9e9e1;
  --ink: #17140f;
  --ink-2: #67635b;
  --ink-3: #a29e95;
  --line: rgba(23, 20, 15, .08);
  --orange: #ff5b14;
  --orange-hi: #ffa142;
  --lime: #8bf06b;
  --lime-soft: #dffcd3;
  --lime-ink: #2a7f1b;
  --sun: #ffc233;
  --pink: #ff3b6b;
  --violet: #8a5cff;
  --down-soft: #ffe3ea;
  --down-ink: #c2183f;
  --up-soft: #fff0e6;
  --scrim: rgba(23, 20, 15, .4);
  --accent: #ff5b14; --on-accent: #ffffff; --accent-ink: #c94408; --accent-soft: rgba(255, 91, 20, .14); --accent-line: #ff5b14;
  --shadow: 0 1px 0 rgba(23, 20, 15, .04);
  --shadow-lg: 0 20px 40px -20px rgba(23, 20, 15, .45);
  --display: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 22px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.35 var(--text); -webkit-font-smoothing: antialiased; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { overscroll-behavior-y: none; }
input, textarea { border: 0; outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.field input:focus-visible, .search input:focus-visible, .form .in:focus-visible, .stepper input:focus-visible, .timefields input:focus-visible { outline: none; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.press { transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
.press:active { transform: scale(.96); }

#app { min-height: 100vh; padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 36px); }
#app.no-tabs { padding-bottom: calc(96px + var(--safe-b)); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── nav ─────────────────────────────────────────────── */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255, 255, 255, .86); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.nav .title { flex: 1; min-width: 0; text-align: center; font: 800 17px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
.nav .side { flex: 0 0 auto; min-width: 76px; display: flex; align-items: center; gap: 6px; }
.nav .side.r { justify-content: flex-end; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent-ink); font-weight: 600; font-size: 17px; padding: 10px 6px 10px 0; margin-left: -6px; }
.back svg.i { width: 24px; height: 24px; stroke-width: 2.6; }
.link { color: var(--accent-ink); font-size: 17px; font-weight: 600; padding: 10px 0; }

.hello { padding-top: 6px; }
.eyebrow { font: 800 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.hello h1, .large h1 { margin: 2px 0 0; font: 900 36px/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.hello h1 em { font-style: normal; color: var(--accent-ink); }
.large { padding-top: 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }

/* sync */
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding: 6px 0; }
.sync .s-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync.saving .s-dot { background: var(--accent); animation: pulse 1s infinite; }
.sync.saved .s-dot { background: var(--lime); box-shadow: 0 0 0 3px var(--lime-soft); }
.sync.waiting .s-dot, .sync.error .s-dot { background: var(--sun); }
.sync.error { color: var(--down-ink); }
.sync.offline .s-dot { background: var(--sun); }
@keyframes pulse { 50% { opacity: .3; } }

/* person switch */
.who { position: relative; display: flex; background: var(--surface); border-radius: 999px; padding: 4px; isolation: isolate; }
.who button { position: relative; z-index: 1; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 999px; font: 800 17px var(--display); color: var(--ink-2); transition: color .2s; }
.who .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 900 13px var(--display); background: var(--pc); color: var(--pon); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.who button[aria-pressed="true"] { color: var(--on-accent); }
.who button[aria-pressed="true"] .av { background: var(--on-accent); color: var(--accent-ink); transform: scale(1.08); }
.who .thumb { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--accent); box-shadow: 0 6px 16px -6px var(--accent); transition: transform .32s cubic-bezier(.3, 1.3, .5, 1), width .3s, background .3s; }
.who.small { display: inline-flex; padding: 3px; }
.who.small button { height: 32px; padding: 0 10px; font-size: 14px; gap: 6px; flex: none; }
.who.small .av { width: 18px; height: 18px; font-size: 10px; }
.who.small .thumb { top: 3px; bottom: 3px; }

/* ── common ──────────────────────────────────────────── */
.section { margin-top: 24px; }
.h2 { margin: 0 4px 10px; font: 800 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.h2 .count { font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; position: relative; min-height: 58px; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .name { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.row .meta { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.row .chev { color: var(--ink-3); }
button.row:active { background: var(--surface-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dc); flex: none; display: inline-block; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.tag .dot { width: 7px; height: 7px; }
.tag.day { background: var(--dt); color: var(--ink); }
.faint { color: var(--ink-3); }
.muted { color: var(--ink-2); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); font-size: 15px; background: var(--surface); border-radius: var(--r); }
.hint { font-size: 13px; color: var(--ink-2); font-weight: 400; margin: 8px 4px 0; }
.err { color: var(--down-ink); font-size: 14px; font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 18px; font: 800 17px var(--display); background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 22px -12px var(--accent); transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), opacity .15s; }
.btn:active { transform: scale(.96); }
.btn.sec { background: var(--surface); color: var(--ink); box-shadow: none; }
.btn.lime { background: var(--lime); color: var(--ink); box-shadow: 0 10px 22px -12px var(--lime-ink); }
.btn.danger { background: transparent; color: var(--down-ink); box-shadow: none; min-height: 46px; font-size: 15px; }
.btn.small { min-height: 38px; padding: 0 16px; font-size: 15px; border-radius: 999px; box-shadow: none; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg.i { stroke-width: 2.6; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.x svg.i { width: 18px; height: 18px; stroke-width: 2.8; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip .dot { width: 9px; height: 9px; }

.seg { display: flex; background: var(--surface); border-radius: 14px; padding: 4px; }
.seg button { flex: 1; min-height: 38px; border-radius: 11px; font: 800 14px var(--display); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(23, 20, 15, .12); }

/* ── Today ───────────────────────────────────────────── */
.who-wrap { margin-top: 16px; }
.pulse-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 700; }
.pill.hot { background: var(--up-soft); color: var(--accent-ink); }
.pill.fresh { background: var(--lime-soft); color: var(--lime-ink); }
.pill svg.i { width: 16px; height: 16px; }

.hero {
  position: relative; display: block; width: 100%; text-align: left; overflow: hidden; color: var(--don);
  border-radius: 28px; padding: 20px 20px 18px; background: linear-gradient(135deg, var(--dc) 0%, var(--dc2) 100%);
  box-shadow: 0 22px 40px -22px var(--dc);
}
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .14;
  background: repeating-linear-gradient(-58deg, transparent 0 16px, var(--don) 16px 19px); -webkit-mask: linear-gradient(90deg, transparent 35%, #000); mask: linear-gradient(90deg, transparent 35%, #000); }
.hero > * { position: relative; }
.hero .badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(255, 255, 255, .24); font: 900 12px var(--display); letter-spacing: .1em; text-transform: uppercase; }
.hero .big { font: 900 58px/1 var(--display); letter-spacing: -.03em; margin-top: 12px; text-transform: uppercase; overflow-wrap: anywhere; }
.hero .when { font-size: 15px; font-weight: 600; opacity: .88; margin-top: 6px; }
.hero .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
.hero .foot span { font-size: 14px; font-weight: 600; opacity: .9; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.go { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: var(--dc); display: grid; place-items: center; flex: none; box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .35); }
.go svg.i { width: 28px; height: 28px; stroke-width: 3; color: var(--ink); }
.cont { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--ink); color: #fff; }
div.cont { padding: 8px 8px 8px 16px; gap: 10px; }
.cont-main { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; text-align: left; color: #fff; padding: 6px 0; }
.cont-fin { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 72px; height: 64px; border-radius: 18px; background: var(--lime); color: var(--ink); font: 800 13px var(--display); flex: none; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
.cont-fin:active { transform: scale(.94); }
.cont-fin svg.i { width: 24px; height: 24px; stroke-width: 3; }
.cont.is-done { background: var(--lime); color: var(--ink); }
.cont.is-done small { color: rgba(23, 20, 15, .65); }
.ring.ok { background: var(--ink); }
.ring.ok span { background: var(--ink); color: var(--lime); }
.ring.ok svg.i { width: 22px; height: 22px; stroke-width: 3.2; }
.cont b { display: block; font: 800 18px var(--display); }
.cont small { font-size: 14px; color: rgba(255, 255, 255, .7); }
.cont .grow { flex: 1; min-width: 0; }
.ring { --p: 0; width: 50px; height: 50px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--lime) calc(var(--p) * 1%), rgba(255, 255, 255, .16) 0); }
.ring span { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; font: 900 16px var(--display); color: #fff; }
.rank { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--dc); color: var(--don); font: 900 17px var(--display); flex: none; }
.others { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.other { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; background: var(--dt); border-radius: 18px; text-align: left; min-width: 0; }
.other b { font: 800 16px var(--display); }
.other small { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.other .dot { width: 12px; height: 12px; }
.foot-links { margin-top: 30px; display: flex; justify-content: center; gap: 20px; font-size: 13px; }
.foot-links a, .foot-links button { color: var(--ink-2); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 13px; padding: 8px 0; }
.foot-links svg.i { width: 15px; height: 15px; }

/* ── Workout ─────────────────────────────────────────── */
.band { background: linear-gradient(140deg, var(--dc) 0%, var(--dc2) 100%); color: var(--don); padding-bottom: 20px; position: relative; overflow: hidden; }
.band::before { content: ""; position: absolute; inset: 0; opacity: .12; pointer-events: none; background: repeating-linear-gradient(-58deg, transparent 0 16px, var(--don) 16px 19px); -webkit-mask: linear-gradient(90deg, transparent 40%, #000); mask: linear-gradient(90deg, transparent 40%, #000); }
.band > * { position: relative; }
.band .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding-top: env(safe-area-inset-top, 0px); }
.band .back { color: var(--don); }
.band h1 { margin: 6px 0 0; font: 900 46px/1 var(--display); letter-spacing: -.03em; text-transform: uppercase; overflow-wrap: anywhere; }
.band .sync { color: var(--don); opacity: .9; }
.datepill { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .24); font: 800 14px var(--display); flex: none; }
.datepill.past { background: var(--ink); color: #fff; }
.datepill input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; -webkit-appearance: none; appearance: none; }
.datepill svg.i { width: 16px; height: 16px; }
.meter { display: flex; align-items: center; gap: 12px; margin-top: 14px; font: 800 15px var(--display); }
.meter .track { flex: 1; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .28); overflow: hidden; }
.meter .track i { display: block; height: 100%; min-width: 12px; background: var(--lime); border-radius: 6px; transition: width .5s cubic-bezier(.3, 1.3, .5, 1); box-shadow: 0 0 12px rgba(139, 240, 107, .9); }
.stickywho { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; padding: 10px 0; background: linear-gradient(var(--bg) 78%, rgba(255, 255, 255, 0)); }

.ex { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 16px 14px 16px 16px; background: var(--surface); border-radius: var(--r); position: relative; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), background .2s; }
.ex:active { transform: scale(.98); }
.ex + .ex { margin-top: 10px; }
.ex.done { background: var(--lime-soft); }
.ex .grow { flex: 1; min-width: 0; }
.ex .name { display: block; font: 800 17px/1.2 var(--display); overflow-wrap: anywhere; }
.ex .line2 { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.ex .line2 b { font: 800 14px var(--display); color: var(--ink); }
.ex .val { text-align: right; flex: none; max-width: 44%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.ex .val .big { font: 900 26px/1 var(--display); letter-spacing: -.02em; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.ex .val .big small { font-size: 13px; font-weight: 800; color: var(--ink-2); margin-left: 1px; }
.check { width: 24px; height: 24px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
.check svg.i { width: 14px; height: 14px; stroke-width: 3.4; }
.pr { display: inline-flex; align-items: center; gap: 4px; font: 900 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--sun); padding: 3px 8px; border-radius: 999px; }
.pr svg.i { width: 12px; height: 12px; stroke-width: 2.8; }
.up { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); vertical-align: -3px; margin-left: 3px; }
.up svg.i { width: 12px; height: 12px; stroke-width: 3.2; }
.plus { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 16px -10px var(--accent); }
.plus svg.i { width: 24px; height: 24px; stroke-width: 3; }
.pdots { display: flex; gap: 4px; }
.pdots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--pl); }
.pdots i.on { background: var(--pc); border-color: var(--pl); }
.addmore { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: var(--r); border: 2px dashed var(--surface-2); color: var(--ink-2); font: 800 16px var(--display); }
.cta { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + var(--safe-b)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(255, 255, 255, 0), var(--bg) 30%); }
.cta-row { display: flex; gap: 8px; max-width: 608px; margin: 0 auto; }
.cta .btn { flex: 1; min-width: 0; display: flex; min-height: 60px; font-size: 18px; justify-content: space-between; padding: 0 18px 0 22px; }
.cta .btn.fin { flex: none; width: 78px; padding: 0; flex-direction: column; justify-content: center; gap: 2px; font-size: 13px; }
.cta .btn.fin svg.i { width: 24px; height: 24px; stroke-width: 3; }
.donechip { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--lime); color: var(--ink); font: 800 13px var(--display); }
.donechip svg.i { width: 15px; height: 15px; stroke-width: 3.2; }
.cta .btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cta .btn small { display: block; font: 700 12px var(--text); opacity: .8; text-align: left; }

/* ── Sheets ─────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; max-height: calc(100% - 10px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--bg); border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(23, 20, 15, .18); transform: translateY(100%); transition: transform .38s cubic-bezier(.2, .9, .25, 1.05); }
.sheet.open { transform: none; }
.sheet.tall { height: calc(100% - 10px - env(safe-area-inset-top, 0px)); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 8px auto 0; flex: none; }

  // ── colour maths: each person/day colour gets a gradient partner, a text-safe ink and an on-colour ──
  function rgb(h) { const n = parseInt(String(h).replace('#', ''), 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

  function applyServer(d) {

  function applyLocal(q, skipIndex) {

      if (q.done && j < 0) S.marks.push({ date: q.date, person: q.person, day: q.day });

  // ── reading values ──────────────────────────────────────────────────────
  // "20 (24)": did 20, pushed a few reps at 24.   "18*": did 18, go heavier next time.
  // Rowing ("dist"): "8:27" = reached the goal distance (2 km) in 8:27; "1.8km" = got to 1.8 km when the time (10 min) ran out.
  function rowGoal(ex) {
    const t = String((ex && ex.target) || '').replace(',', '.');
    const km = t.match(/(\d+(?:\.\d+)?)\s*km/i), mn = t.match(/(\d+)\s*min/i);

  /** Last, today, best (and best pushed) for one person + exercise, seen from `date`. */

  /** The usual jump between weights on this machine (2, 2.5, 3.5…), from both people's history. */

  // ── sessions & the "up next" order ──────────────────────────────────────

    (extras || []).forEach(add);

  const workoutItems = () => itemsFor(S.session.date, S.session.day, S.session.extras);
  /** Every session: a date + day with something logged or marked done, newest first. */
  function allSessions() {
    const m = new Map();

  let flushing = false, retryT = null, retryN = 0;
  const qkey = q => q.t === 's' ? 's|' + q.date + '|' + q.person + '|' + q.day : q.date + '|' + q.person + '|' + q.exerciseId;
  function enqueue(q) {
    applyLocal(q);
    S.queue = S.queue.filter(x => qkey(x) !== qkey(q));
    S.queue.push(Object.assign({ v: Date.now() + '-' + Math.random() }, q));
    store.set('queue', S.queue);
    flush();
  }
  const saveEntry = q => enqueue(Object.assign({ t: 'e' }, q));
  const saveMark = (date, person, day, done) => enqueue({ t: 's', date: date, person: person, day: day, done: !!done });
  function flush() {
    if (flushing) return;
    if (!S.queue.length) { renderSync(); return; }
    flushing = true; S.syncState = 'saving'; renderSync();
    const batch = S.queue.slice();
    api('saveBatch', {
      entries: batch.filter(q => q.t !== 's').map(q => ({ date: q.date, person: q.person, exerciseId: q.exerciseId, session: q.session, value: q.value, note: q.note })),
      sessions: batch.filter(q => q.t === 's').map(q => ({ date: q.date, person: q.person, day: q.day, done: q.done })),
    })
      .then(() => {
        const sent = new Set(batch.map(b => b.v));
        S.queue = S.queue.filter(q => !sent.has(q.v)); store.set('queue', S.queue);
        flushing = false; retryN = 0;
        if (S.queue.length) flush(); else { S.syncState = 'saved'; renderSync(); }
      }, err => {
        flushing = false;
        const msg = String(err && err.message || err);
        const net = isNetErr(msg);
        S.syncState = net ? 'waiting' : 'error';
        renderSync();
        clearTimeout(retryT);
        if (net) retryT = setTimeout(flush, Math.min(30000, 3000 * Math.pow(2, retryN++)));
        else toast('Not saved: ' + msg);
      });
  }
  function syncHTML() {
    switch (S.syncState) {
      case 'saving': return '<span class="s-dot"></span>Saving…';
      case 'waiting': return '<span class="s-dot"></span>Offline · ' + S.queue.length + ' to save';
      case 'error': return '<span class="s-dot"></span>Not saved · Retry';
      case 'saved': return '<span class="s-dot"></span>Saved';
      case 'offline': return '<span class="s-dot"></span>Offline';
      default: return '';
    }
  }
  let savedT = null;
  function renderSync() {
    $$('.sync').forEach(el => { el.className = 'sync ' + S.syncState; el.innerHTML = syncHTML(); });
    if (S.syncState === 'saved') {
      clearTimeout(savedT);
      savedT = setTimeout(() => { if (S.syncState === 'saved') { S.syncState = 'idle'; renderSync(); } }, 2200);
    }
  }
  const syncBtn = () => '<button class="sync ' + S.syncState + '" data-act="retry" aria-live="polite">' + syncHTML() + '</button>';

  // ── shared pieces ───────────────────────────────────────────────────────
  function whoHTML(small, act) {
    return '<div class="who' + (small ? ' small' : '') + '" role="group" aria-label="Who is logging"><span class="thumb"></span>' +
      S.data.people.map(p => '<button data-act="' + (act || 'person') + '" data-p="' + esc(p.name) + '" aria-pressed="' + (p.name === S.person) +
        '" style="--pc:' + esc(p.color) + ';--pon:' + onColor(p.color) + '"><span class="av">' + esc(p.name.charAt(0).toUpperCase()) + '</span>' + esc(p.name) + '</button>').join('') + '</div>';
  }
  function placeThumbs(root, instant) {
    $$('.who', root).forEach(w => {
      const b = $('[aria-pressed="true"]', w), t = $('.thumb', w);
      if (!b || !t) return;
      if (instant) t.style.transition = 'none';
      t.style.width = b.offsetWidth + 'px';
      t.style.transform = 'translateX(' + b.offsetLeft + 'px)';
      if (instant) { void t.offsetWidth; t.style.transition = ''; }
    });
  }
  function nav(o) {
    return '<header class="nav' + (window.scrollY > 8 ? ' scrolled' : '') + '"><div class="wrap">' +
      '<div class="side">' + (o.left || '') + '</div><div class="title" style="' + (o.rootTitle ? 'opacity:' + (window.scrollY > 50 ? 1 : 0) : '') + '" data-root="' + (o.rootTitle ? 1 : 0) + '">' + esc(o.title || '') + '</div>' +
      '<div class="side r">' + (o.right || '') + '</div></div></header>';
  }
  function spark(vals, color, w, h) {
    w = w || 76; h = h || 34;
    if (!vals.length) return '';
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = hi - lo || 1;
    const X = i => vals.length === 1 ? w / 2 : 4 + i * (w - 8) / (vals.length - 1);
    const Y = v => hi === lo ? h / 2 : 4 + (1 - (v - lo) / span) * (h - 8);
    const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join('');
    const li = vals.length - 1;
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      (vals.length > 1 ? '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
      '<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(vals[li]).toFixed(1) + '" r="4" fill="' + color + '" stroke="#fff" stroke-width="2"/></svg>';
  }
  function deltaHTML(d, ex) {
    if (d == null || !isFinite(d)) return '';
    const lb = lowerBetter(ex);
    const r = lb ? Math.round(d) : Math.round(d * 10) / 10;
    if (r === 0) return '<span class="delta flat">' + icon('flat') + 'same</span>';
    const good = lb ? r < 0 : r > 0, a = Math.abs(r);
    const txt = lb ? (a >= 60 ? mss(a) : a + ' s') + (r < 0 ? ' faster' : ' slower') : (r > 0 ? '+' : '−') + fmtN(a) + ' ' + UNIT[unitOf(ex)];
    return '<span class="delta ' + (good ? 'good' : 'bad') + '">' + icon(good ? 'arrowUp' : 'arrowDown') + txt + '</span>';
  }
  function targetText(ex) {
    if (unitOf(ex) === 'dist') { const g = rowGoal(ex); return g.km + ' km or ' + g.min + ' min'; }
    return ex.target || '';
  }

  // ── views ───────────────────────────────────────────────────────────────
  function vToday() {
    const today = todayIso(), d0 = new Date();
    const rec = recommend(S.person);
    const sd = sessionDays(S.person);
    // Today's session exists once something is logged or marked done. Just opening a day doesn't count.
    const todays = sessionsOn(today).filter(x => S.dayBy.has(x.day));
    const curS = todays.find(x => x.people[S.person]) || todays[0] || null;
    const cur = curS ? curS.day : null;
    const dates = Array.from(sd.keys()).sort();
    const weekStart = iso(new Date(Date.now() - 6 * 864e5));
    const thisWeek = dates.filter(d => d >= weekStart).length;
    const lastDate = dates.filter(d => d < today).pop();

    let h = nav({ left: syncBtn(), title: 'Let\'s go, ' + S.person, rootTitle: true }) + '<div class="wrap">';
    h += '<div class="hello"><div class="eyebrow">' + WDL[d0.getDay()] + ' ' + d0.getDate() + ' ' + MONL[d0.getMonth()] + '</div><h1>Let\'s go, <em>' + esc(S.person) + '</em></h1></div>';
    if (people().length > 1) h += '<div class="who-wrap">' + whoHTML(false) + '</div>';
    h += '<div class="pulse-row"><span class="pill hot">' + icon('flame') + (thisWeek ? thisWeek + ' this week' : 'Fresh week') + '</span>' +
      (lastDate ? '<span class="pill fresh">' + (sd.get(lastDate) ? esc(sd.get(lastDate)) + ' ' : 'Last ') + ago(lastDate) + '</span>' : '') + '</div>';

    if (cur) {
      const ex = S.session && S.session.date === today && S.session.day === cur ? S.session.extras : [];
      const items = itemsFor(today, cur, ex).all;
      const done = items.filter(e => S.byKey.has(key(today, S.person, e.id))).length;
      const pct = items.length ? Math.round(done / items.length * 100) : 0;
      const attrs = ' data-date="' + today + '" data-day="' + esc(cur) + '"';
      h += '<div class="section">' + (isMarked(today, S.person, cur)
        ? '<button class="cont is-done press" data-act="open" data-from="today"' + attrs + '><span class="ring ok"><span>' + icon('check') + '</span></span>' +
          '<span class="grow"><b>' + esc(cur) + ' done</b><small>' + done + ' of ' + items.length + ' logged · tap to edit</small></span>' + icon('chev') + '</button>'
        : '<div class="cont"><button class="cont-main" data-act="open" data-from="today"' + attrs + '><span class="ring" style="--p:' + pct + '"><span>' + done + '</span></span>' +
          '<span class="grow"><b>Continue ' + esc(cur) + '</b><small>' + done + ' of ' + items.length + ' logged today</small></span></button>' +
          '<button class="cont-fin" data-act="finish"' + attrs + '>' + icon('check') + 'Finish</button></div>') + '</div>';
    }

    const order = rec.filter(r => r.day.name !== cur);
    if (order.length) {
      const first = order[0], rest = order.slice(1);
      h += '<div class="section"><button class="hero press" data-act="start" data-day="' + esc(first.day.name) + '" style="' + dayVars(first.day.name) + '">' +
        '<span class="badge">' + icon('bolt') + 'Up next</span><div class="big">' + esc(first.day.name) + '</div>' +
        '<div class="when">' + whenText(first) + '</div>' +
        '<div class="foot"><span>' + plural(activeEx(first.day.name).length, 'exercise') + '</span><span class="go" aria-hidden="true">' + icon('arrowR') + '</span></div></button></div>';
      if (rest.length) {
        h += '<div class="section"><div class="h2">After that</div><div class="list">' + rest.map((r, i) =>
          '<button class="row" data-act="start" data-day="' + esc(r.day.name) + '" style="' + dayVars(r.day.name) + '"><span class="rank">' + (i + 2) + '</span>' +
          '<span class="grow"><span class="name">' + esc(r.day.name) + '</span><span class="meta">' + whenText(r) + '</span></span>' + icon('chev', 'chev') + '</button>').join('') + '</div></div>';
      }
    }
    const others = S.data.days.filter(d => !d.rotation);
    if (others.length) {
      h += '<div class="section"><div class="h2">Other days</div><div class="others">' + others.map(d => {
        const last = lastOf(S.person, d.name);
        return '<button class="other press" data-act="start" data-day="' + esc(d.name) + '" style="' + dayVars(d.name) + '"><span class="dot"></span><b>' + esc(d.name) + '</b><small>' +
          plural(activeEx(d.name).length, 'exercise') + (last ? '<br>' + fmtDay(last) : '') + '</small></button>';
      }).join('') + '</div></div>';
    }
    return h + footLinks() + '</div>';
  }
  function whenText(r) {
    if (!r.last) return 'Not done yet';
    return 'Last done ' + fmtDay(r.last) + ' · ' + (r.ago === 1 ? 'last session' : r.ago + ' sessions ago');
  }
  function footLinks() {
    return '<div class="foot-links">' + (S.data.sheetUrl ? '<a href="' + esc(S.data.sheetUrl) + '" target="_blank" rel="noopener">' + icon('ext') + 'Google Sheet</a>' : '') +
      '<button data-act="refresh">' + icon('refresh') + 'Reload</button></div>';

  function vWorkout() {
    const ses = S.session, today = todayIso();
    const it = workoutItems();
    const done = it.all.filter(e => S.byKey.has(key(ses.date, S.person, e.id))).length;
    const pct = it.all.length ? done / it.all.length * 100 : 0;
    let h = '<div class="band" style="' + dayVars(ses.day) + '"><div class="wrap">' +
      '<div class="topbar"><button class="back" data-act="tab" data-v="' + (ses.from === 'log' ? 'log' : 'today') + '">' + icon('back') + (ses.from === 'log' ? 'Log' : 'Today') + '</button>' + syncBtn() + '</div>' +
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><h1>' + esc(ses.day) + '</h1>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' + (isMarked(ses.date, S.person, ses.day) ? '<span class="donechip">' + icon('check') + 'Done</span>' : '') +
      '<label class="datepill' + (ses.date !== today ? ' past' : '') + '">' + icon('cal') + (ses.date === today ? 'Today' : fmtDayW(ses.date)) +
      '<input type="date" id="w-date" value="' + ses.date + '" max="' + today + '" aria-label="Workout date"></label></div></div>' +
      '<div class="meter"><span class="track"><i style="width:' + pct + '%"></i></span><span>' + done + '/' + it.all.length + '</span></div></div></div>';
    h += '<div class="wrap">';
    h += people().length > 1 ? '<div class="stickywho">' + whoHTML(false) + '</div>' : '<div style="height:12px"></div>';
    if (!it.all.length) h += '<div class="empty">No exercises in ' + esc(ses.day) + ' yet.<br><button class="link" data-act="newex" data-day="' + esc(ses.day) + '">Add one</button></div>';
    h += it.base.map(e => exCard(e, ses.date, false)).join('');
    if (it.extra.length) h += '<div class="section"><div class="h2">Also today</div>' + it.extra.map(e => exCard(e, ses.date, true)).join('') + '</div>';
    h += '<button class="addmore press" data-act="add">' + icon('plus') + 'Add from another day</button></div>';
    const nx = nextUnlogged(S.person), attrs = ' data-date="' + ses.date + '" data-day="' + esc(ses.day) + '"';
    const marked = isMarked(ses.date, S.person, ses.day);
    h += '<div class="cta"><div class="cta-row">' + (nx
      ? '<button class="btn" data-act="ex" data-id="' + nx.id + '"><span><small>Next up for ' + esc(S.person) + '</small>' + esc(nx.name) + '</span>' + icon('arrowR') + '</button>' +
        '<button class="btn lime fin" data-act="finish"' + attrs + ' aria-label="Finish workout">' + icon('check') + (marked ? 'Done' : 'Finish') + '</button>'
      : '<button class="btn lime" data-act="finish"' + attrs + '><span>' + (marked ? esc(ses.day) + ' is done · edit' : 'Finish ' + esc(ses.day)) + '</span>' + icon('check') + '</button>') + '</div></div>';
    return h;
  }

  function exCard(ex, date, other) {
    const st = exStats(S.person, ex, date);
    const t = st.today, u = unitOf(ex);
    const bits = [];
    const tt = targetText(ex);
    if (tt) bits.push('<span>' + esc(tt) + '</span>');
    if (other) bits.push(dayTag(ex.day));
    if (u === 'done') { if (st.prev) bits.push('<span>Last ' + fmtDay(st.prev.date) + '</span>'); }
    else {
      bits.push('<span>Last <b>' + (st.prev ? valHTML(st.prev.value, ex) : '–') + '</b></span>');
      if (st.best) bits.push('<span>Best <b>' + (u === 'dist' ? valHTML(st.best.e.value, ex, false, true) : fmtN(st.best.p.main)) + '</b></span>');
    }
    if (t && t.note) bits.push('<span>' + esc(t.note) + '</span>');
    const dots = people().length > 1 ? '<span class="pdots">' + people().map(p =>
      '<i class="' + (S.byKey.has(key(date, p, ex.id)) ? 'on' : '') + '" style="--pc:' + esc(pColor(p)) + ';--pl:' + lineOf(pColor(p)) + '" title="' + esc(p) + '"></i>').join('') + '</span>' : '';
    const right = t
      ? '<div class="val"><div class="big">' + (valHTML(t.value, ex, u !== 'dist') || '–') + '<span class="check">' + icon('check') + '</span></div>' + (st.isPR ? '<span class="pr">' + icon('trophy') + 'New best</span>' : '') + dots + '</div>'
      : '<div class="val"><span class="plus">' + icon('plus') + '</span>' + dots + '</div>';
    return '<button class="ex' + (t ? ' done' : '') + '" data-act="ex" data-id="' + ex.id + '"><span class="grow"><span class="name">' + esc(ex.name) +
      '</span><span class="line2">' + bits.join('') + '</span></span>' + right + '</button>';
  }

  function vLog() {
    let h = nav({ left: syncBtn(), title: 'Log', rootTitle: true, right: '<button class="link" data-act="addsession" aria-label="Add a session">' + icon('plus') + '</button>' }) + '<div class="wrap">';
    h += '<div class="large"><h1>Log</h1><button class="btn small" data-act="addsession">' + icon('plus') + 'Add session</button></div>';
    h += '<p class="hint">Every workout, newest first. Open one to fill in or fix weights.</p>';

    let month = '';

      const d = toDate(x.date), m = x.date.slice(0, 7);

      }

      const total = names.reduce((a, p) => a + x.people[p].n, 0);
      const meta = x.date === today ? 'Today' : ago(x.date).replace(/^./, c => c.toUpperCase());
      h += '<button class="row lrow" data-act="open" data-from="log" data-date="' + x.date + '" data-day="' + esc(x.day) + '" style="' + dayVars(x.day) + '">' +
        '<span class="dtile"><b>' + d.getDate() + '</b><small>' + WD[d.getDay()] + '</small></span>' +
        '<span class="grow"><span class="name"><span class="dot"></span> ' + esc(x.day) + '</span><span class="meta">' + meta + ' · ' + (total ? plural(total, 'entry', 'entries') : 'marked done, no weights') + '</span></span>' +
        '<span class="whon">' + names.map(p => '<span title="' + esc(p) + '"><i style="--pc:' + esc(pColor(p)) + ';--pon:' + onColor(pColor(p)) + '">' + esc(p.charAt(0)) + '</i>' +
          (x.people[p].n ? x.people[p].n : '') + (x.people[p].done ? '<span class="ck">' + icon('check') + '</span>' : '') + '</span>').join('') + '</span>' + icon('chev', 'chev') + '</button>';
      if (i === list.length - 1) h += '</div></div>';
    });
    return h + footLinks() + '</div>';
  }

  function vProgress() {
    let h = nav({ left: syncBtn(), title: 'Progress', rootTitle: true, right: people().length > 1 ? whoHTML(true) : '' }) + '<div class="wrap">';
    h += '<div class="large"><h1>Progress</h1></div>';
    if (S.ptab === 'progress') {
      const dates = Array.from(sessionDays(S.person).keys()).sort();
      const cut = iso(new Date(Date.now() - 30 * 864e5));
      let bests = 0;
      S.data.exercises.forEach(ex => {
        let b = null;
        (S.byEx.get(S.person + '|' + ex.id) || []).forEach(e => {
          const p = parseVal(e.value, ex);
          if (!p || p.main == null) return;
          if (e.date >= cut && b != null && better(p.main, b, ex)) bests++;
          if (b == null || better(p.main, b, ex)) b = p.main;
        });
      });
      h += '<div class="tiles">' +
        '<div class="tile t1"><div class="k">Sessions<br>last 30 days</div><div class="v">' + dates.filter(d => d >= cut).length + '</div><div class="d">' + esc(S.person) + '</div></div>' +
        '<div class="tile t2"><div class="k">New bests<br>last 30 days</div><div class="v">' + bests + '</div><div class="d">beat your record</div></div>' +
        '<div class="tile t3"><div class="k">All<br>sessions</div><div class="v">' + dates.length + '</div><div class="d">' + (dates.length ? 'since ' + fmtDay(dates[0]) : '–') + '</div></div></div>';
    }
    h += '<div class="seg" style="margin-top:16px" role="tablist">' +
      ['progress', 'raw'].map(t => '<button data-act="ptab" data-t="' + t + '" aria-pressed="' + (S.ptab === t) + '">' + (t === 'progress' ? 'Progress' : 'Raw data') + '</button>').join('') + '</div>';
    h += '<div class="chips" style="margin-top:12px">' + ['All'].concat(S.data.days.map(d => d.name)).map(n =>
      '<button class="chip" data-act="pfilter" data-f="' + esc(n) + '" aria-pressed="' + (S.pfilter === n) + '"' + (n !== 'All' ? ' style="' + dayVars(n) + '"' : '') + '>' +
      (n !== 'All' ? '<span class="dot"></span>' : '') + esc(n) + '</button>').join('') + '</div>';
    h += S.ptab === 'progress' ? progressList() : rawGrid();
    return h + footLinks() + '</div>';
  }

  function progressList() {
    const line = lineOf(pColor(S.person));
    let out = '';
    S.data.days.filter(d => S.pfilter === 'All' || d.name === S.pfilter).forEach(d => {
      const rows = S.data.exercises.filter(e => e.day === d.name).sort((a, b) => (a.archived - b.archived) || a.order - b.order).map(ex => {
        const list = S.byEx.get(S.person + '|' + ex.id) || [];
        if (!list.length) return '';
        const last = list[list.length - 1];
        let right, sp = '';
        if (unitOf(ex) === 'done') right = '<b>' + list.length + '×</b><span class="delta flat">done</span>';
        else {
          const nums = list.map(e => parseVal(e.value, ex)).filter(p => p && p.main != null).map(p => p.main);
          sp = spark(nums.slice(-14).map(v => lowerBetter(ex) ? -v : v), line);
          const first = nums[0], lastN = nums[nums.length - 1];
          right = nums.length
            ? '<b>' + metricText(lastN, ex) + '<small>' + metricUnit(ex) + '</small></b>' + (nums.length > 1 ? deltaHTML(lastN - first, ex) : '<span class="delta flat">1 entry</span>')
            : '<b>' + esc(last.value) + '</b>';
        }
        return '<button class="row prow" data-act="detail" data-id="' + ex.id + '"><span class="grow"><span class="name' + (ex.archived ? ' faint' : '') + '">' + esc(ex.name) + '</span>' +
          '<span class="meta">' + plural(list.length, 'entry', 'entries') + ' · last ' + fmtDay(last.date) + '</span></span>' + sp + '<span class="pv">' + right + '</span></button>';
      }).join('');
      if (rows) out += '<div class="section"><div class="h2"><span class="dot" style="' + dayVars(d.name) + '"></span>' + esc(d.name) + '</div><div class="list">' + rows + '</div></div>';
    });
    return out || '<div class="empty" style="margin-top:16px">Nothing logged for ' + esc(S.person) + (S.pfilter !== 'All' ? ' in ' + esc(S.pfilter) : '') + ' yet.</div>';
  }

  function rawGrid() {
    const groups = [];
    S.data.days.filter(d => S.pfilter === 'All' || d.name === S.pfilter).forEach(d => {
      const list = S.data.exercises.filter(e => e.day === d.name && (!e.archived || (S.byEx.get(S.person + '|' + e.id) || []).length))
        .sort((a, b) => (a.archived - b.archived) || a.order - b.order);
      if (list.length) groups.push({ day: d, list: list });
    });
    const ids = new Set();
    groups.forEach(g => g.list.forEach(e => ids.add(e.id)));
    const dateSet = new Set();
    S.log.forEach(e => { if (e.person === S.person && ids.has(e.exId)) dateSet.add(e.date); });

  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'confetti';
    const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    document.body.appendChild(c);
    const g = c.getContext('2d'); if (!g) { c.remove(); return; }
    g.scale(dpr, dpr);
    const cols = ['#FF5B14', '#8BF06B', '#FFC233', '#FF3B6B', '#8A5CFF', '#FFA142'];
    const P = [];
    for (let i = 0; i < 120; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * .95, v = 8 + Math.random() * 10;
      P.push({ x: W / 2, y: H * .72, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .45, c: cols[i % cols.length] });
    }
    const t0 = performance.now();
    (function frame(t) {
      const e = t - t0;
      g.clearRect(0, 0, W, H);
      P.forEach(p => {
        p.vy += .34; p.vx *= .986; p.vy *= .986; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - e / 1900); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
      });
      if (e < 1900) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  // ── chart (progress detail) ─────────────────────────────────────────────
  function niceTicks(lo, hi, n) {
    if (lo === hi) { lo -= 1; hi += 1; }
    const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), e = raw / mag;
    const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
    const out = [];
    for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
    return out;
  }
  function drawChart() {
    const box = $('#chart'); if (!box) return;
    const ex = S.exBy.get(S.detail), lb = lowerBetter(ex);
    const days = { '1M': 31, '3M': 92, '6M': 183, '1Y': 366 }[S.range];
    const cut = days ? iso(new Date(Date.now() - days * 864e5)) : '';
    const pts = points(S.byEx.get(S.person + '|' + ex.id) || [], ex).filter(p => p.date >= cut);
    if (!pts.length) return;
    const pc = pColor(S.person), color = lineOf(pc);
    const W = Math.max(260, box.clientWidth - 12), H = 230, P = { l: 42, r: 14, t: 16, b: 26 };
    let x0 = pts[0].t, x1 = pts[pts.length - 1].t;
    if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
    const ys = [];
    pts.forEach(p => { ys.push(p.y); if (p.alt != null) ys.push(p.alt); });
    const ticks = niceTicks(Math.min.apply(null, ys), Math.max.apply(null, ys), 4);
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = t => P.l + (t - x0) / (x1 - x0) * (W - P.l - P.r);
    // rowing pace: faster (smaller) at the top, so up is always better
    const Y = v => lb ? P.t + (v - y0) / (y1 - y0) * (H - P.t - P.b) : P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
    const base = H - P.b;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(ex.name) + ' chart">' +
      '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + pc + '" stop-opacity=".42"/><stop offset="1" stop-color="' + pc + '" stop-opacity="0"/></linearGradient></defs>';
    s += '<g class="grid">' + ticks.map(v => '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>').join('') + '</g>';
    s += '<g class="axis">' + ticks.map(v => '<text x="' + (P.l - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + metricText(v, ex) + '</text>').join('');
    const span = (x1 - x0) / 864e5, xt = [];
    const d0 = new Date(x0), d1 = new Date(x1);
    if (span > 75) {
      for (let d = new Date(d0.getFullYear(), d0.getMonth() + (d0.getDate() > 1 ? 1 : 0), 1); d <= d1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) xt.push({ t: +d, l: MON[d.getMonth()] });
      const every = Math.ceil(xt.length / 6);
      for (let i = xt.length - 1; i >= 0; i--) if (i % every) xt.splice(i, 1);
    } else {
      const step = span > 35 ? 14 : span > 12 ? 7 : span > 5 ? 2 : 1;
      for (let d = new Date(d0); d <= d1; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + step)) xt.push({ t: +d, l: d.getDate() + ' ' + MON[d.getMonth()] });
    }
    s += xt.map(x => '<text x="' + X(x.t).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + x.l + '</text>').join('') + '</g>';
    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
    if (pts.length > 1) {
      s += '<path d="' + line + 'L' + X(pts[pts.length - 1].t).toFixed(1) + ',' + base + 'L' + X(pts[0].t).toFixed(1) + ',' + base + 'Z" fill="url(#ga)"/>';
      s += '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    pts.forEach(p => {
      if (p.alt == null) return;
      s += '<line x1="' + X(p.t).toFixed(1) + '" x2="' + X(p.t).toFixed(1) + '" y1="' + Y(p.y).toFixed(1) + '" y2="' + Y(p.alt).toFixed(1) + '" stroke="' + color + '" stroke-opacity=".45" stroke-width="2"/>' +
        '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.alt).toFixed(1) + '" r="4.5" fill="#fff" stroke="' + color + '" stroke-width="2.2"/>';
    });
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      s += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (last ? 7 : 4.5) + '" fill="' + (last ? pc : color) + '" stroke="#fff" stroke-width="2.4"/>';
    });
    s += '<g id="xh" style="display:none"><line y1="' + P.t + '" y2="' + base + '" stroke="#17140f" stroke-opacity=".3" stroke-width="1.2"/><circle r="8" fill="none" stroke="' + color + '" stroke-width="2.4"/></g>';
    s += '</svg><div class="tip" id="tip" hidden></div>';
    box.innerHTML = s;

    const svg = $('svg', box), xh = $('#xh', box), tip = $('#tip', box);
    let cur = -1;
    const show = i => {
      cur = Math.max(0, Math.min(pts.length - 1, i));
      const p = pts[cur], px = X(p.t), py = Y(p.y);
      xh.style.display = '';
      $('line', xh).setAttribute('x1', px); $('line', xh).setAttribute('x2', px);
      $('circle', xh).setAttribute('cx', px); $('circle', xh).setAttribute('cy', py);
      tip.innerHTML = '';
      const b = document.createElement('b'); b.textContent = valText(p.raw, ex) + (p.alt != null ? '' : '');
      const d = document.createElement('div'); d.textContent = fmtDayW(p.date) + (lb ? ' · ' + mss(p.y) + ' /500m' : '');
      tip.appendChild(b); tip.appendChild(d);
      if (p.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = p.note; tip.appendChild(n); }
      tip.hidden = false;
      const scale = svg.getBoundingClientRect().width / W, tw = tip.offsetWidth, bw = box.clientWidth;
      tip.style.left = Math.max(4, Math.min(bw - tw - 4, px * scale + 4 - tw / 2)) + 'px';
      tip.style.top = (py * scale > 95 ? 4 : H * scale - 76) + 'px';
    };
    const nearest = clientX => {
      const r = svg.getBoundingClientRect(), x = (clientX - r.left) * W / r.width;
      let bi = 0, bd = Infinity;
      pts.forEach((p, i) => { const dd = Math.abs(X(p.t) - x); if (dd < bd) { bd = dd; bi = i; } });
      return bi;
    };
    box.onpointermove = e => show(nearest(e.clientX));
    box.onpointerdown = e => show(nearest(e.clientX));
    box.onpointerleave = e => { if (e.pointerType === 'mouse') { xh.style.display = 'none'; tip.hidden = true; } };
    box.onkeydown = e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(cur < 0 ? pts.length - 1 : cur + (e.key === 'ArrowLeft' ? -1 : 1)); }
    };
  }

  // ── sheets ──────────────────────────────────────────────────────────────

  function enableSwipe(sh) {
    let y0 = null, dy = 0;
    sh.addEventListener('touchstart', e => {
      const body = $('.sbody', sh);
      const onHead = e.target.closest('.grab, .shead');
      if (!onHead && !(body && body.contains(e.target) && body.scrollTop <= 0)) return;

    sh.addEventListener('touchend', () => {

      sh.style.transition = ''; sh.style.transform = '';

  // entry sheet ------------------------------------------------------------
  const FIELD_RE = /^\s*(\d+(?:[.,]\d+)?)\s*(?:\(\s*(\d+(?:[.,]\d+)?)\s*\))?\s*$/;
  function openEntry(exId, date) {
    if (!S.exBy.get(exId)) return;
    S.entry = { exId: exId, date: date || (S.view === 'workout' && S.session ? S.session.date : todayIso()), person: S.person, startPerson: S.person };
    loadDraft();
    openSheet('entry', true);
  }
  /** Fill the entry boxes from a stored value. */
  function fillDraft(v, ex) {
    const E = S.entry, u = unitOf(ex);
    E.up = v.indexOf('*') >= 0;
    E.w = E.p = E.mm = E.ss = E.km = ''; E.raw = v;
    if (u === 'done') { E.mode = 'done'; E.done = !!v; return; }
    if (u === 'dist') {
      const p = v ? parseVal(v, ex) : null;
      if (!v) { const prev = exStats(E.person, ex, E.date).prev, pp = prev && parseVal(prev.value, ex); E.mode = 'row'; E.rmode = pp && pp.kind === 'dist' ? 'dist' : 'time'; }
      else if (p && p.kind === 'time') { E.mode = 'row'; E.rmode = 'time'; E.mm = String(Math.floor(p.sec / 60)); E.ss = pad(p.sec % 60); }
      else if (p && p.kind === 'dist') { E.mode = 'row'; E.rmode = 'dist'; E.km = fmtKm(p.km); }
      else E.mode = 'raw';
      return;
    }
    const m = v.replace(/\*/g, '').match(FIELD_RE);
    if ((!v.trim() || m) && !(u !== 'kg' && m && m[2])) { E.mode = 'fields'; E.w = m ? m[1].replace(',', '.') : ''; E.p = m && m[2] ? m[2].replace(',', '.') : ''; }
    else E.mode = 'raw';
  }
  function loadDraft() {
    const E = S.entry, ex = S.exBy.get(E.exId);
    const cur = S.byKey.get(key(E.date, E.person, E.exId));
    E.orig = { value: cur ? cur.value : '', note: cur ? cur.note : '' };
    E.note = E.orig.note;
    fillDraft(E.orig.value, ex);
    E.base = draftValue();   // "unchanged" — so opening an old "*40 (50)" and closing doesn't count as an edit
  }
  function draftValue() {
    const E = S.entry, ex = S.exBy.get(E.exId), u = unitOf(ex), star = E.up ? '*' : '';
    if (E.mode === 'done') return E.done ? (E.orig.value || '✓') : '';
    if (E.mode === 'raw') return String(E.raw || '').trim().replace(/\s+/g, ' ');
    if (E.mode === 'row') {
      if (E.rmode === 'time') {
        const m = parseInt(E.mm, 10), s = parseInt(E.ss, 10);
        if (isNaN(m) && isNaN(s)) return '';
        return (m || 0) + ':' + pad(Math.min(59, s || 0)) + star;
      }
      const k = cleanNum(E.km);
      return k && +k > 0 ? k + 'km' + star : '';
    }
    const w = cleanNum(E.w), p = u === 'kg' ? cleanNum(E.p) : '';
    if (!w && !p) return '';
    if (!w) return '(' + p + ')';
    return w + star + (p ? ' (' + p + ')' : '');
  }
  function commitEntry(withToast) {
    const E = S.entry; if (!E) return false;
    const ex = S.exBy.get(E.exId);
    const value = draftValue(), note = String(E.note || '').trim();
    if (value === E.base && note === E.orig.note) return false;
    if (!value && !note) return false;
    saveEntry({ date: E.date, person: E.person, exerciseId: E.exId, session: sessionFor(E.date, E.person, ex), value: value, note: note });
    E.orig = { value: value, note: note }; E.base = value;
    if (exStats(E.person, ex, E.date).isPR) {
      buzz([18, 40, 18]); confetti();
      toast('New best for ' + E.person + ': ' + valText(value, ex), true);
    } else {
      buzz(12);
      if (withToast) toast('Saved for ' + E.person + (value ? ' · ' + valText(value, ex) : ''));
    }
    return true;
  }
  function nextTarget() {
    const E = S.entry;
    const waiting = people().filter(p => p !== E.person && !S.byKey.has(key(E.date, p, E.exId)));
    if (waiting.length) return { type: 'person', person: waiting[0] };
    if (S.view === 'workout' && S.session && S.session.date === E.date) {
      const items = workoutItems().all, i = items.findIndex(x => x.id === E.exId);
      for (let j = i + 1; j < items.length; j++) if (!S.byKey.has(key(E.date, E.startPerson, items[j].id))) return { type: 'ex', ex: items[j] };
      for (let j = 0; j < i; j++) if (!S.byKey.has(key(E.date, E.startPerson, items[j].id))) return { type: 'ex', ex: items[j] };
    }
    return null;
  }
  function recentNotes(person, exId) {
    const seen = [];
    (S.byEx.get(person + '|' + exId) || []).slice().reverse().forEach(e => { if (e.note && seen.indexOf(e.note) < 0 && e.note.length <= 40 && seen.length < 3) seen.push(e.note); });
    return seen;
  }
  function stepperHTML(f, label, val, placeholder, unit, small) {

      (unit ? '<span class="unit">' + unit + '</span>' : '') + '</span></label>' +
      '<button class="sbtn more" data-act="step" data-f="' + f + '" data-d="1" aria-label="More ' + label + '">' + icon('plus') + '</button></div>';
  }

    let best;
    if (u === 'done') best = '<div class="v">' + st.list.length + '<small>×</small></div><div class="d">' + (st.list.length ? 'since ' + fmtDay(st.list[0].date) : 'not yet') + '</div>';

    } else if (E.mode === 'raw') {
      h += '<label class="field raw"><span class="lab">' + UNIT_LABEL[u] + ', your way</span><input id="e-raw" data-in="raw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="20 (24)" value="' + esc(E.raw) + '"></label>';
    } else if (E.mode === 'row') {
      const g = rowGoal(ex);

      '<button class="x" data-act="close" aria-label="Close">' + icon('x') + '</button></div><div class="sbody"><div class="list">' +
      S.data.days.map((d, i) => '<div class="row" style="' + dayVars(d.name) + '"><span class="rank" style="width:34px;height:34px;font-size:14px">' + esc(d.name.charAt(0)) + '</span><button class="grow" style="text-align:left" data-act="dedit" data-day="' + esc(d.name) + '"><span class="name">' + esc(d.name) + '</span>' +
        '<span class="meta">' + plural(activeEx(d.name).length, 'exercise') + (d.rotation ? ' · in rotation' : '') + '</span></button><span class="ord">' +
        '<button data-act="dmv" data-day="' + esc(d.name) + '" data-dir="-1" aria-label="Move ' + esc(d.name) + ' up"' + (i === 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
        '<button data-act="dmv" data-day="' + esc(d.name) + '" data-dir="1" aria-label="Move ' + esc(d.name) + ' down"' + (i === S.data.days.length - 1 ? ' disabled' : '') + '>' + icon('down') + '</button></span></div>').join('') +
      '</div><button class="btn sec block" style="margin-top:14px" data-act="dnew">' + icon('plus') + 'Add a day</button></div>';
  }

  // finish a workout: who trained? ------------------------------------------
  function openFinish(date, day) {
    const items = itemsFor(date, day, S.session && S.session.date === date && S.session.day === day ? S.session.extras : []).all;
    const who = {};
    people().forEach(p => {
      const n = items.filter(e => S.byKey.has(key(date, p, e.id))).length;
      who[p] = isMarked(date, p, day) || n > 0 || p === S.person;
    });
    S.fin = { date: date, day: day, who: who, items: items };
    openSheet('finish', false);
  }
  function sFinish() {
    const f = S.fin;
    let h = '<div class="grab"></div><div class="shead"><div class="grow"><h3>Finish ' + esc(f.day) + '</h3><div class="sub">' + dayTag(f.day) +
      '<span>' + (f.date === todayIso() ? 'Today' : fmtDayW(f.date)) + '</span></div></div><button class="x" data-act="close" aria-label="Close">' + icon('x') + '</button></div><div class="sbody">';
    h += '<div class="h2" style="margin-top:6px">Who trained?</div><div class="list">' + people().map(p => {
      const n = f.items.filter(e => S.byKey.has(key(f.date, p, e.id))).length;
      return '<div class="row"><span class="av-lg" style="--pc:' + esc(pColor(p)) + ';--pon:' + onColor(pColor(p)) + '">' + esc(p.charAt(0)) + '</span>' +
        '<span class="grow"><span class="name">' + esc(p) + '</span><span class="meta">' + (n ? n + ' of ' + f.items.length + ' logged' : 'nothing logged') + '</span></span>' +
        '<button class="switch" role="switch" data-act="fwho" data-p="' + esc(p) + '" aria-checked="' + !!f.who[p] + '" aria-label="' + esc(p) + ' trained"></button></div>';
    }).join('') + '</div>';
    h += '<p class="hint">Marked done, it counts for Up next even if you didn\'t log any weights.</p>';
    h += '<div class="actions"><button class="btn lime only" data-act="fsave">' + icon('check') + 'Mark as done</button></div>';
    return h + '</div>';
  }

  // add a session you didn't log ----------------------------------------------
  function sAddSession() {
    const a = S.add, t0 = todayIso();
    const quick = [[t0, 'Today'], [iso(new Date(Date.now() - 864e5)), 'Yesterday'], [iso(new Date(Date.now() - 2 * 864e5)), fmtDayW(iso(new Date(Date.now() - 2 * 864e5)))]];
    const exists = sessionsOn(a.date).some(x => x.day === a.day);
    let h = '<div class="grab"></div><div class="shead"><div class="grow"><h3>Add a session</h3><div class="sub">For a workout you didn\'t log</div></div>' +
      '<button class="x" data-act="close" aria-label="Close">' + icon('x') + '</button></div><div class="sbody"><div class="form">';
    h += '<div class="f">When<div class="daypick">' + quick.map(q => '<button data-act="asdate" data-d="' + q[0] + '" aria-pressed="' + (a.date === q[0]) + '" style="--dc:var(--ink);--don:#fff">' + q[1] + '</button>').join('') +
      '</div><input class="in" type="date" id="as-date" value="' + a.date + '" max="' + t0 + '" aria-label="Date"></div>';
    h += '<div class="f">Day<div class="daypick">' + S.data.days.map(d =>
      '<button data-act="asday" data-day="' + esc(d.name) + '" aria-pressed="' + (a.day === d.name) + '" style="' + dayVars(d.name) + '"><span class="dot"></span>' + esc(d.name) + '</button>').join('') + '</div></div>';
    if (exists) h += '<p class="hint" style="margin-top:-6px">There\'s already a ' + esc(a.day) + ' session on ' + fmtDayW(a.date) + '. This opens it.</p>';
    h += '<button class="btn block" data-act="asopen"><span>Open ' + esc(a.day) + ' · ' + (a.date === t0 ? 'Today' : fmtDayW(a.date)) + '</span>' + icon('arrowR') + '</button>';
    h += '<p class="hint">Log the weights you remember, or tap Finish to only mark it done.</p>';
    return h + '</div></div>';
  }
  function openSession(date, day, from) {
    const keep = S.session && S.session.date === date && S.session.day === day ? S.session.extras || [] : [];
    S.session = { date: date, day: day, extras: keep, from: from || 'today' };
    store.set('session', S.session);
    go('workout');
  }

  // ── actions ─────────────────────────────────────────────────────────────
  const reorderT = {};
  function switchEntryPerson(p) {
    S.person = p; store.set('person', S.person); setAccent();
    S.entry.person = p; loadDraft(); renderSheet(false);
  }
  const ACT = {
    tab: t => go(t.dataset.v),
    person: t => { if (t.dataset.p === S.person) return; S.person = t.dataset.p; store.set('person', S.person); setAccent(); buzz(8); render(); },
    start: t => openSession(todayIso(), t.dataset.day, 'today'),
    open: t => openSession(t.dataset.date, t.dataset.day, t.dataset.from),
    finish: t => openFinish(t.dataset.date, t.dataset.day),
    fwho: t => { S.fin.who[t.dataset.p] = !S.fin.who[t.dataset.p]; renderSheet(true); buzz(8); },
    fsave: () => {
      const f = S.fin;
      let any = false;
      people().forEach(p => {
        if (f.who[p]) any = true;
        if (!!f.who[p] !== isMarked(f.date, p, f.day)) saveMark(f.date, p, f.day, !!f.who[p]);
      });
      const fromWorkout = S.view === 'workout', back = S.session && S.session.from === 'log' ? 'log' : 'today';
      closeSheet(false);
      if (any) { confetti(); buzz([18, 40, 18]); toast(f.day + ' done' + (f.date === todayIso() ? '' : ' · ' + fmtDayW(f.date)) + '!', true); }
      else toast('Not marked done');
      if (fromWorkout) go(back);
    },
    addsession: () => {
      const r = recommend(S.person)[0];
      S.add = { date: todayIso(), day: r ? r.day.name : (S.data.days[0] || {}).name };
      openSheet('addsession', false);
    },
    asdate: t => { S.add.date = t.dataset.d; renderSheet(true); },
    asday: t => { S.add.day = t.dataset.day; renderSheet(true); },
    asopen: () => { const a = S.add; closeSheet(false); openSession(a.date, a.day, 'log'); },
    ex: t => openEntry(t.dataset.id),
    cell: t => openEntry(t.dataset.id, t.dataset.date),
    add: () => { S.pq = ''; openSheet('picker', true); },
    pick: t => {
      S.session.extras = (S.session.extras || []).concat(t.dataset.id); store.set('session', S.session);
      closeSheet(false);
      setTimeout(() => openEntry(t.dataset.id), 340);
    },
    close: () => closeSheet(),
    epers: t => { if (t.dataset.p === S.entry.person) return; commitEntry(true); switchEntryPerson(t.dataset.p); buzz(8); },
    next: () => {
      const nx = nextTarget();
      commitEntry(!nx);
      if (!nx) return closeSheet(false);
      if (nx.type === 'person') switchEntryPerson(nx.person);
      else { S.entry.exId = nx.ex.id; switchEntryPerson(S.entry.startPerson); }
      render();
    },
    remove: () => {
      const E = S.entry, ex = S.exBy.get(E.exId);
      saveEntry({ date: E.date, person: E.person, exerciseId: E.exId, session: sessionFor(E.date, E.person, ex), value: '', note: '' });
      toast('Removed ' + E.person + '\'s ' + ex.name);
      closeSheet(false);
    },
    mode: () => {
      const E = S.entry, ex = S.exBy.get(E.exId);
      if (E.mode === 'raw') fillDraft(String(E.raw || ''), ex);
      else { E.raw = draftValue(); E.mode = 'raw'; }
      renderSheet(true);
      const f = $(E.mode === 'raw' ? '#e-raw' : '#e-w'); if (f) f.focus();
    },
    same: () => {
      const E = S.entry, ex = S.exBy.get(E.exId), prev = exStats(E.person, ex, E.date).prev;
      if (!prev) return;
      fillDraft(prev.value.replace(/\*/g, ''), ex);
      renderSheet(true); buzz(8);
    },
    try: t => { S.entry.w = t.dataset.v; renderSheet(true); buzz(8); },
    up: () => { S.entry.up = !S.entry.up; renderSheet(true); buzz(8); },
    step: t => {
      const E = S.entry, ex = S.exBy.get(E.exId), f = t.dataset.f, d = +t.dataset.d;
      const prev = exStats(E.person, ex, E.date).prev, prevP = prev ? parseVal(prev.value, ex) : null;
      let v = parseFloat(cleanNum(E[f]));
      if (isNaN(v)) {
        // empty box: start from last time (or from the weight, for "pushed to")
        if (f === 'p') v = (parseFloat(cleanNum(E.w)) || (prevP && prevP.main) || 0) + d * stepFor(ex);
        else if (f === 'km') v = prevP && prevP.kind === 'dist' ? prevP.km + d * .05 : 1.8;
        else v = (prevP && prevP.main != null ? prevP.main : 0) + d * stepFor(ex);
      } else v += d * (f === 'km' ? .05 : stepFor(ex));
      E[f] = String(Math.max(0, Math.round(v * 100) / 100));
      const inp = $('#e-' + f); if (inp) inp.value = E[f];
      refreshSaveAs(); buzz(6);
    },
    rmode: t => { S.entry.rmode = t.dataset.m; renderSheet(true); },
    qnote: t => { S.entry.note = t.dataset.n; renderSheet(true); },
    donetoggle: () => { S.entry.done = !S.entry.done; renderSheet(true); buzz(10); },
    ptab: t => { S.ptab = t.dataset.t; store.set('ptab', S.ptab); render(); },
    pfilter: t => { S.pfilter = t.dataset.f; render(); },
    detail: t => { if (S.sheet) closeSheet(); S.detail = t.dataset.id; go('detail'); },
    range: t => { S.range = t.dataset.r; store.set('range', S.range); render(); },
    order: () => { S.reorder = !S.reorder; render(); },
    mv: t => {
      const e = S.exBy.get(t.dataset.id), list = activeEx(e.day), i = list.indexOf(e), j = i + (+t.dataset.dir);
      if (j < 0 || j >= list.length) return;
      list.splice(i, 1); list.splice(j, 0, e);
      list.forEach((x, k) => { x.order = k + 1; });
      render();
      clearTimeout(reorderT[e.day]);
      reorderT[e.day] = setTimeout(() => manage('reorderExercises', [e.day, list.map(x => x.id)], () => { if (!S.sheet) render(); }), 700);
    },
    newex: t => openExEditor(null, t.dataset.day, !!t.dataset.add),
    editex: t => openExEditor(t.dataset.id),
    arch: () => { S.showArchived = !S.showArchived; render(); },
    fday: t => { S.form.day = t.dataset.day; renderSheet(true); },
    funit: t => { S.form.unit = t.dataset.u; renderSheet(true); },
    exsave: () => saveExercise(),
    farchive: () => {
      const f = S.form;
      manage('saveExercise', [{ id: f.id, name: f.name.trim() || S.exBy.get(f.id).name, day: f.day, target: f.target, unit: f.unit, description: f.description, archived: !f.archived }],
        () => { toast(f.archived ? 'Restored ' + f.name : 'Archived ' + f.name); closeSheet(false); });
    },
    fdelete: () => {
      const f = S.form;
      if (!f.confirmDel) { f.confirmDel = true; renderSheet(true); return; }
      manage('deleteExercise', [f.id], () => { toast('Deleted ' + f.name); closeSheet(false); });
    },
    days: () => { S.dform = null; openSheet('days', true); },
    dedit: t => { const d = S.dayBy.get(t.dataset.day); S.dform = { oldName: d.name, name: d.name, color: d.color, rotation: d.rotation, err: '' }; renderSheet(); },
    dnew: () => { S.dform = { oldName: '', name: '', color: SWATCHES[6], rotation: false, err: '' }; renderSheet(); },
    dback: () => { S.dform = null; renderSheet(); },
    dcolor: t => { S.dform.color = t.dataset.c; renderSheet(true); },
    drot: () => { S.dform.rotation = !S.dform.rotation; renderSheet(true); },
    dsave: () => {
      const f = S.dform;
      if (!f.name.trim()) { f.err = 'Give the day a name.'; renderSheet(true); return; }
      manage('saveDay', [{ oldName: f.oldName, name: f.name.trim(), color: f.color, rotation: f.rotation }], () => {
        if (S.session && S.session.day === f.oldName) { S.session.day = f.name.trim(); store.set('session', S.session); }
        S.dform = null; renderSheet(); render();
      });
    },
    ddelete: () => {
      const f = S.dform;
      if (!f.confirmDel) { f.confirmDel = true; renderSheet(true); return; }
      manage('deleteDay', [f.oldName], () => { S.dform = null; renderSheet(); render(); });
    },
    dmv: t => {
      const names = S.data.days.map(d => d.name), i = names.indexOf(t.dataset.day), j = i + (+t.dataset.dir);
      if (j < 0 || j >= names.length) return;
      names.splice(i, 1); names.splice(j, 0, t.dataset.day);
      S.data.days.sort((a, b) => names.indexOf(a.name) - names.indexOf(b.name)).forEach((d, k) => { d.order = k + 1; });
      renderSheet(true); render();
      clearTimeout(reorderT.__days);
      reorderT.__days = setTimeout(() => manage('reorderDays', [names], () => { renderSheet(true); }), 700);
    },
    retry: () => { if (S.queue.length) { retryN = 0; flush(); } },
    refresh: () => refresh(true),
  };

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const f = ACT[t.dataset.act];
    if (f) { e.preventDefault(); f(t, e); }
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.in; if (!k) return;
    const v = e.target.value;
    if (k === 'pq') { S.pq = v; $('#p-list').innerHTML = pickList(); return; }
    if (k.indexOf('f.') === 0) { S.form[k.slice(2)] = v; return; }
    if (k.indexOf('d.') === 0) { S.dform[k.slice(2)] = v; return; }
    if (S.entry) {
      S.entry[k] = v;
      if (k === 'mm' && v.length >= 2) { const n = $('#e-ss'); if (n) n.focus(); }   // two minute digits → jump to seconds
      refreshSaveAs();
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'as-date' && e.target.value && S.add) {
      S.add.date = e.target.value > todayIso() ? todayIso() : e.target.value;
      renderSheet(true);
    }
    if (e.target.id === 'w-date' && e.target.value) {
      S.session.date = e.target.value > todayIso() ? todayIso() : e.target.value;
      store.set('session', S.session); render();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'e-note') { e.preventDefault(); closeSheet(); }
    if (e.key === 'Enter' && /^e-(w|p|raw|km|mm|ss)$/.test(e.target.id)) { e.preventDefault(); const n = $('#e-note'); if (n) n.focus(); }
    if (e.key === 'Escape' && S.sheet) closeSheet();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.data && Date.now() - S.lastLoad > 120000 && !S.sheet) refresh(false);
    if (!document.hidden) flush();
  });
  window.addEventListener('online', () => { retryN = 0; if (S.syncState === 'offline') S.syncState = 'idle'; flush(); if (S.data) refresh(false); });
  window.addEventListener('offline', () => { if (!S.queue.length && S.syncState !== 'saving') { S.syncState = 'offline'; renderSync(); } });

  function refresh(loud) {
    return api('getData').then(d => {
      applyServer(d); S.lastLoad = Date.now();
      if (S.syncState === 'offline') { S.syncState = 'idle'; renderSync(); }
      if (!S.sheet) render();
      if (loud) toast('Up to date');
    }, err => {
      const m = String(err && err.message || err);
      if (/^KEY:/.test(m)) return showConnect(m.slice(4).trim());
      if (isNetErr(m)) { if (!S.queue.length) { S.syncState = 'offline'; renderSync(); } if (loud) toast('Offline · showing the copy on this phone'); }
      else if (loud) toast('Couldn\'t reload: ' + m);
    });
  }
  function restoreView() {
    if (S.session && S.session.date === todayIso() && S.dayBy.has(S.session.day) && store.get('view', '') === 'workout') S.view = 'workout';
  }
  /** Start from the copy saved on this phone (instant, works offline), then refresh from the sheet. */
  function boot() {
    if (IS_APP) {
      const q = new URLSearchParams(location.search);
      if (q.get('api') && q.get('key')) { store.set('api', q.get('api')); store.set('key', q.get('key')); }
      if (!conn().api || !conn().key) return showConnect();
    }
    $('.tabbar').classList.remove('hide');
    const cached = store.get('data', null);
    let shown = false;
    if (cached && cached.days && cached.log) {
      try { applyServer(cached); restoreView(); render(); shown = true; } catch (e) { shown = false; }
    }
    if (!shown) $('#view').innerHTML = '<div class="boot"><div><div class="spin"></div>Loading your log…</div></div>';
    api('getData').then(d => {
      applyServer(d); S.lastLoad = Date.now();
      if (!shown) restoreView();
      if (S.syncState === 'offline') S.syncState = 'idle';
      if (!S.sheet) render(); else renderSync();
      flush();
    }, err => {
      const m = String(err && err.message || err);
      if (/^KEY:/.test(m)) return showConnect(m.slice(4).trim());
      if (shown) {
        S.syncState = isNetErr(m) ? (S.queue.length ? 'waiting' : 'offline') : 'error';
        renderSync();
        if (!isNetErr(m)) toast('Couldn\'t reach your sheet: ' + m);
        if (S.queue.length && isNetErr(m)) { clearTimeout(retryT); retryT = setTimeout(flush, 5000); }
        return;
      }
      $('#view').innerHTML = '<div class="boot"><div><p style="font-weight:800;color:var(--ink)">' + (isNetErr(m) ? 'No signal' : 'Gym couldn\'t load your sheet.') + '</p><p>' +
        esc(isNetErr(m) ? 'Gym needs a connection the very first time, to copy your log onto this phone. After that it opens offline.' : m) +
        '</p><button class="btn" data-act="reboot">Try again</button></div></div>';
    });
  }
  ACT.reboot = boot;

  // The iPhone app's one-time connect screen.
  function showConnect(msg) {
    $('.tabbar').classList.add('hide');
    $('#view').innerHTML = '<div class="wrap connect"><img src="icon-180.png" alt="" width="96" height="96"><h1>Connect Gym</h1>' +
      '<p>On your computer, open your Gym Google Sheet and choose <b>Gym → Install on iPhone</b>. Scan the QR code with this phone, then add that page to your Home Screen.</p>' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<label class="field"><span class="lab">Or paste the install link</span><input id="c-link" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…?api=…&key=…"></label>' +
      '<button class="btn block" style="margin-top:12px" data-act="connect">Connect</button></div>';
  }
  ACT.connect = () => {
    let u;
    try { u = new URL(($('#c-link') || {}).value.trim()); } catch (e) { u = null; }
    const apiUrl = u && u.searchParams.get('api'), k = u && u.searchParams.get('key');
    if (!apiUrl || !k || !/^https:\/\/script\.google\.com\//.test(apiUrl)) return showConnect('That isn\'t the install link. It contains ?api=…&key=…');
    store.set('api', apiUrl); store.set('key', k);
    try { history.replaceState(null, '', location.pathname + '?api=' + encodeURIComponent(apiUrl) + '&key=' + encodeURIComponent(k)); } catch (e) { /* fine */ }
    boot();
  };

  // Installable app: keep a copy of the app on the phone so it opens without signal, and pick up new versions.
  if (IS_APP && 'serviceWorker' in navigator) {
    let had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !S.sheet) location.reload(); had = true; });
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* still works online */ }); });
  }

  window.GymApp = { S: S, parseVal: parseVal, recommend: recommend, render: render, stepFor: ex => stepFor(ex) };
  boot();
})();

</script>
</body>
</html>
